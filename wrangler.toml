name = "cognitive-mirror"
main = "worker.js"
compatibility_date = "2025-01-01"

[triggers]
# ogni 20 min 10-14 UTC = avviso BYD; 06:00 UTC = check-in mattutino (7/8 Roma), 11:00 UTC = check di metà giornata
crons = ["0 6 * * *", "0 11 * * *", "*/20 10-14 * * *"]

[[kv_namespaces]]
binding = "MORNING_KV"
id = "INSERISCI_ID_KV"

[vars]
